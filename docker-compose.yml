services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: dealflow360-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealflow360
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealflow360"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dealflow360-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dealflow360
      JWT_ACCESS_SECRET: dealflow360-jwt-access-secret-key-docker
      JWT_REFRESH_SECRET: dealflow360-jwt-refresh-secret-key-docker
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend Web App (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: dealflow360-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: dealflow360_postgres_data
